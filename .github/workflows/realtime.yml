Name: Upbit Realtime Analyzer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime Analyzer
        run: |
          python realtime.py

      - name: Commit and push generated dashboard & db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/
          git commit -m "Auto: Update realtime dashboard & evolution data [skip ci]" || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push
