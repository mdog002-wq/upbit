name: Upbit Realtime Analyzer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime Analyzer
        run: |
          python realtime.py

      - name: Commit and push generated dashboard & db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git reset --soft origin/${{ github.ref_name }}
          git add docs/index.html data/
          if git commit -m "Auto: Update realtime dashboard & evolution data [skip ci]"; then
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
