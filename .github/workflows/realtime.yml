name: Upbit Realtime Analyzer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [backend_complete]

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Blocked Time Window (02:00 ~ 03:00 KST)
        run: |
          # 한국 시간(KST) 기준 현재 '시'와 '분' 구하기
          HOUR=$(TZ="Asia/Seoul" date +%H)
          MINUTE=$(TZ="Asia/Seoul" date +%M)
          
          echo "Current KST Time: ${HOUR}:${MINUTE}"
          
          # 새벽 2시(02시) 전체 (02:00 ~ 02:59 KST) 차단
          if [ "$HOUR" -eq 02 ]; then
            echo "Notice: Current time is within the restricted window (02:00 ~ 03:00 KST). Skipping workflow execution."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime Analyzer
        run: |
          python realtime.py

      - name: Commit and push generated dashboard & db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git reset --soft origin/${{ github.ref_name }}
          git add docs/index.html data/
          if git commit -m "Auto: Update realtime dashboard & evolution data [skip ci]"; then
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
