Name: Upbit Realtime Analyzer & Pattern Trainer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [backend_complete]
  schedule:
    # 하루에 한번 00:00 UTC (KST 09:00) 실시간 분석 자동 실행
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
   
    steps:
      - name: Check Blocked Time Window (02:00 ~ 02:14 KST)
        run: |
          HOUR=$(TZ="Asia/Seoul" date +%k | tr -d ' ')
          MINUTE=$(TZ="Asia/Seoul" date +%M | sed 's/^0//')
          MINUTE=${MINUTE:-0}
         
          echo "Current KST Time: ${HOUR}:${MINUTE}"
         
          if [ "$HOUR" -eq 2 ] && [ "$MINUTE" -ge 0 ] && [ "$MINUTE" -le 14 ]; then
            echo "Notice: Current time is within restricted window (02:00 ~ 02:14 KST). Skipping."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pyupbit pandas numpy requests openpyxl tqdm google-genai websockets fastdtw; fi

      # 1단계: 실시간 대시보드 스크립트 실행
      - name: Run Realtime Analyzer
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python realtime.py

      # 2단계: 대시보드 결과물 커밋/푸시
      - name: Commit and push generated dashboard
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
         
          git pull origin main --rebase --autostash || echo "No rebase needed"
          git add docs/index.html 2>/dev/null || git add .
         
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto: Update realtime dashboard [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
