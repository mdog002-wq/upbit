name: Upbit Realtime Analyzer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [backend_complete]

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Blocked Time Window (02:00 ~ 02:14 KST)
        run: |
          # 한국 시간(KST) 기준 현재 '시'와 '분' 구하기
          HOUR=$(TZ="Asia/Seoul" date +%k | tr -d ' ')
          MINUTE=$(TZ="Asia/Seoul" date +%M | sed 's/^0//')
          MINUTE=${MINUTE:-0}
          
          echo "Current KST Time: ${HOUR}:${MINUTE}"
          
          # 새벽 2시(02시)이고, 분이 00분 ~ 14분 사이인 경우 차단
          if [ "$HOUR" -eq 2 ] && [ "$MINUTE" -ge 0 ] && [ "$MINUTE" -le 14 ]; then
            echo "Notice: Current time is within the restricted window (02:00 ~ 02:14 KST). Skipping workflow execution."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime Analyzer
        run: |
          python realtime.py

      - name: Commit and push generated dashboard & db
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin ${{ github.ref_name }} --rebase --autostash || echo "No rebase needed"
          git add docs/index.html data/ 2>/dev/null || git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto: Update realtime dashboard & evolution data [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
