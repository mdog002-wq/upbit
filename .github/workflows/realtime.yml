name: Upbit Realtime Analyzer & Pattern Trainer

on:
  workflow_dispatch:
  repository_dispatch:
    types: [backend_complete]
  schedule:
    # 30분마다 자동 실행하여 실시간 대시보드 데이터 갱신
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pyupbit pandas numpy requests openpyxl tqdm google-genai websockets fastdtw pydantic; fi

      # 1단계: 실시간 대시보드 스크립트 정상 실행 (1회 배치 실행)
      - name: Run Realtime Analyzer
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python realtime.py

      # 2단계: 대시보드 JSON 데이터 커밋/푸시
      - name: Commit and push generated dashboard
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
         
          git pull origin main --rebase --autostash || echo "No rebase needed"
          
          # docs/ 및 data/ 폴더 내 변경된 파일 스테이징
          git add docs/ data/ 2>/dev/null || git add .
         
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto: Update realtime dashboard data [skip ci]"
            git push origin main
          else
            echo "No changes to commit"
          fi
