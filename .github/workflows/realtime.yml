Name: Upbit Realtime Analyzer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리를 불러와 Git 동기화 오류 방지

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Realtime Analyzer
        run: |
          python realtime.py

      - name: Commit and push generated dashboard & db
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 원격 최신 커밋 가져오기 (커밋되지 않은 로컬 변경사항 유지)
          git fetch origin ${{ github.ref_name }}
          git reset --soft origin/${{ github.ref_name }}
          
          # 2. 변경된 파일 스테이징 및 커밋
          git add docs/index.html data/
          if git commit -m "Auto: Update realtime dashboard & evolution data [skip ci]"; then
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
