name: Upbit AI Auto Evolution Cron

on:
  schedule:
    # ⏱️ 실행 주기 설정 (UTC 기준이므로 한국 시간보다 9시간 느립니다)
    # 아래 예시는 5분마다 실행되도록 설정한 것입니다. (스팀릿 클라우드와 연동하려면 보통 1시간 단위나 스케줄 주기로 맞춥니다)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 웹에서 수동으로도 실행할 수 있게 설정

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 깃허브 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 4. 업비트 AI 분석 스크립트 실행
        run: |
          python realtime_upbit.py  # 본인의 메인 파이썬 파일명으로 수정하세요

      - name: 5. 변경된 DB 및 JSON 파일을 깃허브에 자동 저장(Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add upbit_history.db strategy_weights.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] 업비트 AI 자가진화 데이터 및 가중치 자동 갱신" && git push)
