name: Upbit AI Auto Evolution Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 깃허브 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 라이브러리 직접 강제 설치
        run: |
          python -m pip install --upgrade pip
          pip install streamlit requests pandas streamlit-autorefresh

      - name: 4. 업비트 AI 분석 스크립트 실행
        run: |
          python realtime_upbit.py

      - name: 5. 변경된 DB 및 JSON 파일을 깃허브에 자동 저장(Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add upbit_history.db strategy_weights.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Bot] 업비트 AI 자가진화 데이터 및 가중치 자동 갱신" && git push)
