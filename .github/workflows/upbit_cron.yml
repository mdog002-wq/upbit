name: Upbit AI Evolution Cron Action

on:
  # 💡 실행 주기 설정 (UTC 기준, 매 1시간마다 실행. 한국 시간은 +9시간)
  schedule:
    - cron: '0 * * * *' 
  
  # GitHub 웹페이지에서 수동으로도 실행할 수 있게 설정
  workflow_dispatch:

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 💡 저장소에 파일(DB, JSON) 자동 커밋을 위한 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Upbit Analyzer Script
        run: |
          # 실제 실행하는 파이썬 파일명에 맞춰주세요 (main.py 또는 realtime_upbit.py)
          python realtime_upbit.py

      - name: Commit and push updated DB & weights
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 💡 파일별로 올바르게 예외 처리 및 git add 수행
          if [ -f "upbit_history.db" ]; then git add upbit_history.db; fi
          if [ -f "strategy_weights.json" ]; then git add strategy_weights.json; fi
          if [ -f "docs/index.html" ]; then git add docs/index.html; fi
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Upbit analysis DB & evolved weights [skip ci]" && git push)

          
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Upbit analysis DB & evolved weights [skip ci]" && git push)
