name: Upbit Learn Pattern

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-learner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pattern Learner
        run: |
          python learn_pattern.py

      - name: Commit and push learned golden pattern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/golden_pattern.json
          git commit -m "Auto: Update golden pattern from past 6 months data [skip ci]" || echo "No changes to commit"
          git push
