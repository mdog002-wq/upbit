name: Upbit Learn Pattern

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-learner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 최신 커밋 이력을 안전하게 Rebase하기 위해 fetch-depth 설정
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests pandas numpy pyupbit; fi

      - name: Run Pattern Learner
        run: |
          python learn_pattern.py

      - name: Commit and push learned golden pattern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/golden_pattern.json
          
          # 변경사항이 있는 경우에만 커밋 및 rebase 후 푸시
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto: Update golden pattern from past 6 months data [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
