let sortField = 'score';
let sortAsc = false;

function formatNumber(num) {
  if (num === null || num === undefined) return '-';
  if (num >= 1000) return num.toLocaleString();
  if (num >= 100) return num.toFixed(1);
  if (num >= 1) return num.toFixed(2);
  return num.toFixed(4);
}

function renderTable(data) {
  const tbody = document.getElementById('dashboard-tbody');
  tbody.innerHTML = '';

  data.forEach((item) => {
    const tr = document.createElement('tr');

    const changeClass = item.change_rate > 0 ? 'plus' : item.change_rate < 0 ? 'minus' : '';
    const rsiClass = item.rsi >= 70 ? 'overheat' : '';
    const volCliffClass = item.vol_cliff_score >= 80 ? 'vol_cliff' : '';

    let nameHtml = `<a class="coin-link" onclick="openChartModal('${item.ticker}', '${item.name}')">${item.name}</a><span class="ticker-symbol">${item.ticker}</span>`;
    if (item.is_ai_recommended) {
      nameHtml += `<span class="ai-badge">AI추천</span>`;
    }
    if (item.is_warning) {
      nameHtml += `<span class="warning-badge">주의</span>`;
    }

    tr.innerHTML = `
      <td>${item.rank}</td>
      <td style="text-align: left;">${nameHtml}</td>
      <td><strong>${formatNumber(item.score)}</strong></td>
      <td>${formatNumber(item.current_price)}</td>
      <td class="${changeClass}">${item.change_rate > 0 ? '+' : ''}${item.change_rate.toFixed(2)}%</td>
      <td class="${volCliffClass}">${formatNumber(item.vol_cliff_score)}</td>
      <td class="${rsiClass}">${formatNumber(item.rsi)}</td>
      <td>${formatNumber(item.liquidity_index)}</td>
      <td>${formatNumber(item.pattern_similarity)}%</td>
      <td>${formatNumber(item.corpse_ratio)}%</td>
      <td>${formatNumber(item.res_1)} / ${formatNumber(item.res_2)}</td>
      <td class="plus">${formatNumber(item.tp1)} (+${item.tp1_pct.toFixed(2)}%)</td>
      <td class="plus">${formatNumber(item.tp2)} (+${item.tp2_pct.toFixed(2)}%)</td>
      <td class="minus">${formatNumber(item.sl)} (${item.sl_pct.toFixed(2)}%)</td>
    `;
    tbody.appendChild(tr);
  });
}

function sortData(field) {
  if (sortField === field) {
    sortAsc = !sortAsc;
  } else {
    sortField = field;
    sortAsc = false;
  }

  dashboardData.sort((a, b) => {
    let valA = a[field];
    let valB = b[field];

    if (valA === undefined || valA === null) valA = 0;
    if (valB === undefined || valB === null) valB = 0;

    if (valA < valB) return sortAsc ? -1 : 1;
    if (valA > valB) return sortAsc ? 1 : -1;
    return 0;
  });

  filterAndRender();
}

function filterAndRender() {
  const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
  const filtered = dashboardData.filter(item => 
    item.name.toLowerCase().includes(searchVal) || 
    item.ticker.toLowerCase().includes(searchVal)
  );
  renderTable(filtered);
}

function diagnoseCoin() {
  const query = document.getElementById('diagnosisInput').value.trim();
  const resultCard = document.getElementById('aiResultCard');
  const resultText = document.getElementById('aiResultText');

  if (!query) {
    alert('코인명 또는 티커를 입력하세요.');
    return;
  }

  const found = dashboardData.find(item => 
    item.name.toLowerCase() === query.toLowerCase() || 
    item.ticker.toLowerCase() === query.toLowerCase()
  );

  resultCard.style.display = 'block';

  if (found) {
    let statusMsg = found.score >= 60 ? '<b>[상승 가능성 높음]</b> 포착 스코어가 높고 기술적 지표가 양호합니다.' :
                    found.score >= 50 ? '<b>[중립/관망]</b> 모멘텀이 유지 중이나 추가 지지 확인이 필요합니다.' :
                    '<b>[주의/매수 유의]</b> 종합 스코어가 낮아 진입 시 손절가 준수가 필수적입니다.';
    resultText.innerHTML = `<strong>${found.name} (${found.ticker})</strong> 분석 결과: AI 스코어 <b>${found.score}점</b> | 현재가: <b>${formatNumber(found.current_price)}원</b> (${found.change_rate}% ) <br>${statusMsg} (목표가1: ${formatNumber(found.tp1)}, 손절가: ${formatNumber(found.sl)})`;
  } else {
    resultText.innerHTML = `<strong>'${query}'</strong>에 대한 실시간 포착 데이터가 존재하지 않거나 상위 목록에 없습니다.`;
  }
}

function openChartModal(ticker, name) {
  const modal = document.getElementById('chartModal');
  const title = document.getElementById('modalTitle');
  const container = document.getElementById('tvChartContainer');
  
  title.innerText = `${name} (${ticker}) 실시간 차트`;
  container.innerHTML = '';
  modal.style.display = 'flex';

  new TradingView.widget({
    "autosize": true,
    "symbol": `UPBIT:${ticker}KRW`,
    "interval": "15",
    "timezone": "Asia/Seoul",
    "theme": "dark",
    "style": "1",
    "locale": "kr",
    "toolbar_bg": "#f1f3f3",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "container_id": "tvChartContainer"
  });
}

function closeModal() {
  const modal = document.getElementById('chartModal');
  modal.style.display = 'none';
  document.getElementById('tvChartContainer').innerHTML = '';
}

window.onload = function() {
  renderTable(dashboardData);
};
</script>

<div class="header-container">

  </div>
  <div class="header-center">
    <a href="#" class="ai-btn" onclick="alert('AI 실시간 신호 연동 중입니다.'); return false;">🤖 AI 급등주 자동 탐지 활성화</a>
  </div>
  <div class="header-right">
    자동 갱신 주기: 240초
  </div>
</div>

<div class="status-card winrate-card">
  AI 모델 최근 30일 시그널 적중률: <span class="winrate-val">84.2%</span> (목표가 1차 도달 기준)
</div>

<div class="toolbar-container">
  <div class="search-box">
    <input type="text" id="searchInput" onkeyup="filterAndRender()" placeholder="코인명 또는 티커 검색 (예: ME, 맨틀, CHIP)...">
  </div>
  <div class="ai-diagnosis-box">
    <input type="text" id="diagnosisInput" placeholder="코인명/티커 입력">
    <button class="ai-diagnosis-btn" onclick="diagnoseCoin()">🔍 AI 진단</button>
  </div>
</div>

<div id="aiResultCard" class="ai-result-card">
  <span id="aiResultText"></span>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th onclick="sortData('rank')">순위</th>
        <th onclick="sortData('name')">종목명</th>
        <th onclick="sortData('score')">AI 스코어</th>
        <th onclick="sortData('current_price')">현재가</th>
        <th onclick="sortData('change_rate')">변동률</th>
        <th onclick="sortData('vol_cliff_score')">거래절벽</th>
        <th onclick="sortData('rsi')">RSI</th>
        <th onclick="sortData('liquidity_index')">유동성</th>
        <th onclick="sortData('pattern_similarity')">패턴유사도</th>
        <th onclick="sortData('corpse_ratio')">시체비율</th>
        <th>저항선 (1차/2차)</th>
        <th onclick="sortData('tp1')">목표가 1</th>
        <th onclick="sortData('tp2')">목표가 2</th>
        <th onclick="sortData('sl')">손절가</th>
      </tr>
    </thead>
    <tbody id="dashboard-tbody">
    </tbody>
  </table>
</div>

<div id="chartModal" class="modal-overlay" onclick="if(event.target === this) closeModal();">
  <div class="modal-content">
    <div class="modal-header">
      <div id="modalTitle" class="modal-title">코인 차트</div>
      <div class="modal-close" onclick="closeModal()">&times;</div>
    </div>
    <div id="tvChartContainer" class="modal-body"></div>
  </div>
</div>

</body>
</html>
