<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upbit 실시간 급등 포착 (R사이트)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111419; color: #e1e6ed; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e232d; border: 1px solid #2c3240; border-radius: 8px; padding: 15px; cursor: pointer; transition: border-color 0.2s; }
        .card:hover { border-color: #007bff; }
        .plus { color: #00b4d8; }
        .minus { color: #ff4d4d; }

        /* 모달 레이아웃 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 9999; justify-content: center; align-items: center;
        }
        .modal-box {
            background: #ffffff; color: #333333; border-radius: 12px;
            width: 820px; max-width: 95vw; height: 500px; padding: 20px; display: flex; flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #ffffff;">⚡ Upbit 실시간 급등 분석 (R사이트)</h2>
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <!-- 2열 동시 표시 모달 -->
    <div id="coinDetailModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation();">
            
            <!-- 모달 헤더 -->
            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 1px solid #dee2e6;">
                <h4 id="rModalTitle" style="margin: 0; font-size: 18px; font-weight: bold; color: #111;">종목 상세 정보</h4>
                <button onclick="closeModal()" style="border:none; background:none; font-size: 20px; cursor:pointer; color: #666;">✕</button>
            </div>

            <!-- 2열 배치 컨테이너 -->
            <div style="display: flex; gap: 15px; flex: 1; min-height: 0;">
                <!-- 좌측: R사이트 정보 -->
                <div style="flex: 1; background: #f8f9fa; border-radius: 8px; padding: 15px; overflow-y: auto;">
                    <h5 style="margin-top:0; margin-bottom: 12px; font-size: 14px; color: #007bff; font-weight: bold;">⚡ R사이트 (실시간 급등)</h5>
                    <div id="rModalContentR"></div>
                </div>

                <!-- 우측: A사이트 iframe -->
                <div style="flex: 1; border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden;">
                    <iframe id="modalIframeA" src="" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
            </div>

        </div>
    </div>

    <script>
        const analysisData = [{"market": "KRW-BTC", "name": "비트코인", "ticker": "BTC", "current_price": 135000000, "change_rate": 1.25, "score": 92.5, "rank": 1, "pattern_similarity": 89.2, "accumulation_score": 85, "liquidity_index": 95, "up_5pct_count": 12, "down_5pct_count": 2}, {"market": "KRW-ETH", "name": "이더리움", "ticker": "ETH", "current_price": 4200000, "change_rate": -0.85, "score": 88.0, "rank": 2, "pattern_similarity": 78.4, "accumulation_score": 72, "liquidity_index": 88, "up_5pct_count": 8, "down_5pct_count": 4}, {"market": "KRW-XRP", "name": "리플", "ticker": "XRP", "current_price": 850, "change_rate": 4.12, "score": 81.2, "rank": 3, "pattern_similarity": 91.0, "accumulation_score": 90, "liquidity_index": 82, "up_5pct_count": 15, "down_5pct_count": 5}];

        const gridEl = document.getElementById('cardGrid');
        analysisData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(item.market);
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
                    <b style="font-size: 16px;">${item.name}</b>
                    <span style="color:#888;">${item.ticker}</span>
                </div>
                <div style="display:flex; justify-content:space-between; font-size: 14px;">
                    <span>${item.current_price.toLocaleString()} KRW</span>
                    <span class="${item.change_rate >= 0 ? 'plus' : 'minus'}">${item.change_rate >= 0 ? '+' : ''}${item.change_rate}%</span>
                </div>
            `;
            gridEl.appendChild(card);
        });

        function openModal(symbol) {
            const item = analysisData.find(d => d.market === symbol || d.ticker === symbol);
            const titleEl = document.getElementById('rModalTitle');
            const contentR = document.getElementById('rModalContentR');
            const iframeA = document.getElementById('modalIframeA');

            if (item) {
                const changeClass = item.change_rate > 0 ? "plus" : (item.change_rate < 0 ? "minus" : "");
                const changeSign = item.change_rate > 0 ? "+" : "";

                titleEl.innerText = `${item.name} (${item.ticker})`;
                contentR.innerHTML = `
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">현재 가격</span><span class="detail-value">${item.current_price.toLocaleString()} KRW</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">전일 대비</span><span class="detail-value ${changeClass}">${changeSign}${item.change_rate}%</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">예측 점수</span><span class="detail-value" style="color:#007bff;">${item.score}점 (${item.rank}위)</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">패턴 유사율</span><span class="detail-value">${item.pattern_similarity}%</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">세력 매집 강도</span><span class="detail-value accumulation">${item.accumulation_score}점</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom:1px solid #eee; font-size: 13px;"><span class="detail-label">유동성 지수</span><span class="detail-value liquidity">${item.liquidity_index}점</span></div>
                    <div class="detail-row" style="display:flex; justify-content:space-between; padding: 6px 0; font-size: 13px;"><span class="detail-label">1주일 5% 변동</span><span class="detail-value"><span class="plus">▲${item.up_5pct_count}</span> / <span class="minus">▼${item.down_5pct_count}</span></span></div>
                `;
                
                // A사이트 iframe 호출
                iframeA.src = `https://upbit-a.onrender.com/?symbol=${item.market}`;
            }

            document.getElementById('coinDetailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('coinDetailModal').style.display = 'none';
            document.getElementById('modalIframeA').src = '';
        }

        // 외부(A사이트)에서 ?symbol= 파라미터로 이 페이지를 iframe 내에 불러왔을 때 렌더링
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const symbolParam = urlParams.get('symbol');

            if (symbolParam) {
                const targetMarket = symbolParam.toUpperCase().startsWith('KRW-') ? symbolParam.toUpperCase() : `KRW-${symbolParam.toUpperCase()}`;
                const item = analysisData.find(d => d.market === targetMarket);

                if (item) {
                    const changeClass = item.change_rate > 0 ? "plus" : (item.change_rate < 0 ? "minus" : "");
                    const changeSign = item.change_rate > 0 ? "+" : "";

                    document.body.innerHTML = `
                        <div style="padding: 15px; font-family: sans-serif; background: #fff; color: #333; height: 100vh; box-sizing: border-box; overflow-y: auto;">
                            <h6 style="margin-bottom: 12px; font-weight: bold; color: #007bff;">⚡ R사이트 (실시간 급등)</h6>
                            <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px;"><span>현재가</span><b>${item.current_price.toLocaleString()} KRW (${changeSign}${item.change_rate}%)</b></div>
                            <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px;"><span>예측 점수</span><b style="color:#007bff;">${item.score}점 (${item.rank}위)</b></div>
                            <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px;"><span>패턴 유사율</span><b>${item.pattern_similarity}%</b></div>
                            <div style="display:flex; justify-content:space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px;"><span>세력 매집</span><b>${item.accumulation_score}점</b></div>
                            <div style="display:flex; justify-content:space-between; padding: 6px 0; font-size: 13px;"><span>유동성 지수</span><b>${item.liquidity_index}점</b></div>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
